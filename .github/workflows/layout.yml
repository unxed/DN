name: layout
# The separation of the projects (tv/ and dn/) and the origin notes of the units.
on:
  workflow_dispatch:
  push:
    paths:
      - tv/**
      - dn/**
      - bootstrap/**
      - tools/check-layout.sh
      - tools/check-platform.py
      - tools/safe-census.py
      - tools/net-audit.sh
      - tools/net-audit.allow
      - tools/ci-par.sh
      - tools/tests/**
      - tools/dn-env.sh
      - docs/BETTER-PASCAL.md
      - .gitmodules
      - bp
      - .github/workflows/layout.yml
jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: The layout, the platform boundary of DN (no platform unit or target conditional outside the backends), the network audit (no network code in dn/ outside the units listed in tools/net-audit.allow), the tests of the tools and of the text policy, side by side
        env:
          CMDS: |
            tools/check-layout.sh
            python3 tools/check-platform.py
            python3 tools/safe-census.py
            tools/net-audit.sh
            python3 -B -m unittest discover -s tools/tests -p 'test_*.py'
        run: tools/ci-par.sh
